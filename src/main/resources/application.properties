# tajweed-backend settings. Every value can be overridden by an environment variable (README.md lists them).
# No secret is ever written in this file: the repository is public (AGENTS.md §1, §8.14).

spring.application.name=tajweed-backend

# --- Database ------------------------------------------------------------------------------------------------------
# Local run: nothing to set — spring-boot-docker-compose starts compose.yaml's PostgreSQL and connects to it.
# Production: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
# The schema is made only by Flyway (db/migration); Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# --- Languages (22) ------------------------------------------------------------------------------------------------
# i18n/messages.properties is Arabic, the default; i18n/messages_<code>.properties for the other 21.
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Web -----------------------------------------------------------------------------------------------------------
# Behind a reverse proxy in production, set SERVER_FORWARDEDHEADERSSTRATEGY=native so the client's address is used.
server.forward-headers-strategy=${SERVER_FORWARDEDHEADERSSTRATEGY:none}
server.compression.enabled=true
server.compression.mime-types=application/json,application/yaml

# --- Health only (no metrics, no trackers — AGENTS.md §5) ----------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- OpenAPI -------------------------------------------------------------------------------------------------------
# The OpenAPI document stays on in production on purpose: it is the public contract of a public API.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.paths-to-match=/v1/**

# --- The application's own settings (AppProperties) ----------------------------------------------------------------
tajweed.app.api-version=1
tajweed.app.author-link=https://www.linkedin.com/in/omarsherif21/
# The web application's origins, comma-separated (CORS_ORIGINS in production). The default is the web on this computer:
# `ng serve` on 4200, or on 4201 when 4200 is taken by another project (2026-11-26).
tajweed.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4201}
# Requests one client may send to /v1/** each minute.
tajweed.rate-limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:120}
# The daily health check of the audio sources (P1-B6): on, at 03:30 UTC, 20 seconds per request.
tajweed.audio-health.enabled=${AUDIO_HEALTH_ENABLED:true}
tajweed.audio-health.cron=${AUDIO_HEALTH_CRON:0 30 3 * * *}
tajweed.audio-health.timeout=${AUDIO_HEALTH_TIMEOUT:20s}
# HadeethEnc's encyclopedia (F13, F29, F35): fetched into the database and refreshed — never kept in a repository
# (the author, 2026-11-22). A daily look at 02:00 UTC syncs when the last full sync is older than 30 days or did not
# finish; one request a second.
tajweed.hadeethenc.enabled=${HADEETHENC_SYNC_ENABLED:true}
tajweed.hadeethenc.base-url=${HADEETHENC_BASE_URL:https://hadeethenc.com/api/v1}
tajweed.hadeethenc.cron=${HADEETHENC_SYNC_CRON:0 0 2 * * *}
tajweed.hadeethenc.delay=${HADEETHENC_SYNC_DELAY:1s}
tajweed.hadeethenc.refresh-after=${HADEETHENC_REFRESH_AFTER:30d}
tajweed.hadeethenc.timeout=${HADEETHENC_TIMEOUT:30s}
# The Quran Foundation's tafsirs (F5, F26), through Content Sync — their only permitted way to keep a copy, synced at
# least every 7 days (here 6). The credentials come only from the environment: QF_CLIENT_ID, QF_CLIENT_SECRET and
# QF_ENV (prelive: surahs 1 – 2 only; production). Without them the tafsir part stays empty; nothing else changes.
tajweed.quran-foundation.enabled=${QF_SYNC_ENABLED:true}
tajweed.quran-foundation.client-id=${QF_CLIENT_ID:}
tajweed.quran-foundation.client-secret=${QF_CLIENT_SECRET:}
tajweed.quran-foundation.env=${QF_ENV:prelive}
tajweed.quran-foundation.cron=${QF_SYNC_CRON:0 30 2 * * *}
# Run the due syncs once the application has started (a new database; one instance only)
tajweed.quran-foundation.sync-on-start=${QF_SYNC_ON_START:false}
tajweed.quran-foundation.refresh-after=${QF_REFRESH_AFTER:6d}
tajweed.quran-foundation.timeout=${QF_TIMEOUT:60s}
tajweed.quran-foundation.auth-url=${QF_AUTH_URL:}
tajweed.quran-foundation.api-url=${QF_API_URL:}
tajweed.quran-foundation.only-tafsirs=
