openapi: 3.1.0
info:
  title: Tajweed - The Noble Quran and Its Sciences — public API
  description: "Public, read-only API of «تجويد - القرآن الكريم وعلومه». No login,\
    \ no accounts. Every answer is a BaseResponse; texts are in the language of the\
    \ Accept-Language header (22 languages, Arabic by default)."
  license:
    name: MIT
    url: https://opensource.org/license/mit
  version: "1"
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Quran
  description: "Surahs, ayahs, pages and juz of the Madinah mushaf — text verbatim\
    \ from Tanzil."
- name: App info
  description: "The application's name, author, API version and languages."
- name: Reciters
  description: "Reciters, recitations (riwayah, style, surahs), audio sources and\
    \ ayah timings."
- name: Content
  description: The content's version and its sources.
paths:
  /v1/surahs:
    get:
      tags:
      - Quran
      summary: "The 114 surahs: names, Makki / Madani, order of revelation, ayahs,\
        \ first page"
      operationId: getSurahs
      parameters:
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseListDtoSurah"
  /v1/surahs/{surahNumber}/ayahs:
    get:
      tags:
      - Quran
      summary: A surah with all its ayahs (verbatim Tanzil text) and the source of
        the text
      operationId: getSurahAyahs
      parameters:
      - name: surahNumber
        in: path
        required: true
        schema:
          type: integer
          format: int32
          maximum: 114
          minimum: 1
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseDtoSurahAyahs"
  /v1/surahs/{surahNumber}/ayahs/{ayahNumber}:
    get:
      tags:
      - Quran
      summary: "One ayah (verbatim Tanzil text) with its page, juz, hizb, quarter\
        \ and sajdah"
      operationId: getAyah
      parameters:
      - name: surahNumber
        in: path
        required: true
        schema:
          type: integer
          format: int32
          maximum: 114
          minimum: 1
      - name: ayahNumber
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseDtoAyah"
  /v1/reciters:
    get:
      tags:
      - Reciters
      summary: "The reciters, each with his recitations: riwayah, style, surahs, timings"
      operationId: getReciters
      parameters:
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseListDtoReciter"
  /v1/reciters/{reciterId}:
    get:
      tags:
      - Reciters
      summary: One reciter with his recitations
      operationId: getReciter
      parameters:
      - name: reciterId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseDtoReciter"
  /v1/recitations/{recitationId}:
    get:
      tags:
      - Reciters
      summary: "A recitation: riwayah, surahs, audio sources in order with their health,\
        \ credits"
      operationId: getRecitation
      parameters:
      - name: recitationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseDtoRecitation"
  /v1/recitations/{recitationId}/surahs/{surahNumber}/timings:
    get:
      tags:
      - Reciters
      summary: The ayah timings of one surah of a recitation (milliseconds in the
        surah file)
      operationId: getTimings
      parameters:
      - name: recitationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: surahNumber
        in: path
        required: true
        schema:
          type: integer
          format: int32
          maximum: 114
          minimum: 1
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseDtoSurahTimings"
  /v1/quran-search:
    get:
      tags:
      - Quran
      summary: "Search the Quran: words with or without tashkeel, a surah name, or\
        \ an ayah reference"
      operationId: search
      parameters:
      - name: q
        in: query
        description: "Words, a surah name, or a reference such as 2:255"
        required: true
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - name: surah
        in: query
        description: The surah open in the reader (a number alone then names one of
          its ayahs)
        required: false
        schema:
          type: integer
          format: int32
          maximum: 114
          minimum: 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 6236
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseDtoQuranSearch"
  /v1/pages/{page}:
    get:
      tags:
      - Quran
      summary: The ayahs that start on a page of the Madinah mushaf (1 – 604)
      operationId: getPage
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: integer
          format: int32
          maximum: 604
          minimum: 1
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseDtoPage"
  /v1/juzs:
    get:
      tags:
      - Quran
      summary: "The 30 juz: the first ayah and page of each"
      operationId: getJuzs
      parameters:
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseListDtoJuz"
  /v1/content-version:
    get:
      tags:
      - Content
      summary: The content's version (a fingerprint of its sources) and the sources
      operationId: getContentVersion
      parameters:
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseDtoContentVersion"
  /v1/app-info:
    get:
      tags:
      - App info
      summary: "The application's name, author, API version and languages"
      operationId: getAppInfo
      parameters:
      - name: Accept-Language
        in: header
        description: The language of the texts in the answer; Arabic when absent or
          not supported.
        required: false
        schema:
          type: string
          default: ar
          enum:
          - ar
          - en
          - ru
          - es
          - de
          - it
          - fr
          - ur
          - hi
          - ko
          - id
          - ja
          - zh
          - tr
          - bn
          - fa
          - ms
          - sw
          - ha
          - pt
          - ps
          - uz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponseDtoAppInfo"
components:
  schemas:
    BaseResponseListDtoSurah:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/DtoSurah"
    DtoSurah:
      type: object
      description: "A surah: number, names, Makki / Madani, order of revelation, ayahs,\
        \ first page."
      properties:
        number:
          type: integer
          format: int32
        nameAr:
          type: string
        nameTransliteration:
          type: string
        nameEn:
          type: string
        revelationType:
          type: string
          enum:
          - MECCAN
          - MEDINAN
        revelationOrder:
          type: integer
          format: int32
        ayahCount:
          type: integer
          format: int32
        startPage:
          type: integer
          format: int32
    BaseResponseDtoSurahAyahs:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/DtoSurahAyahs"
    DtoAyah:
      type: object
      description: "An ayah: verbatim Tanzil text and its page, juz, hizb, quarter\
        \ and sajdah."
      properties:
        id:
          type: integer
          format: int32
        surahNumber:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        text:
          type: string
        basmalaWordCount:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        juz:
          type: integer
          format: int32
        hizb:
          type: integer
          format: int32
        hizbQuarter:
          type: integer
          format: int32
        sajdah:
          type: string
          enum:
          - RECOMMENDED
          - OBLIGATORY
    DtoContentSource:
      type: object
      description: "A source of the content: name, licence, link and checksum."
      properties:
        code:
          type: string
        name:
          type: string
        licence:
          type: string
        sourceUrl:
          type: string
        sha256:
          type: string
        obtainedOn:
          type: string
          format: date
    DtoSurahAyahs:
      type: object
      description: "A surah, its ayahs in order, and the source of the text."
      properties:
        surah:
          $ref: "#/components/schemas/DtoSurah"
        ayahs:
          type: array
          items:
            $ref: "#/components/schemas/DtoAyah"
        textSource:
          $ref: "#/components/schemas/DtoContentSource"
    BaseResponseDtoAyah:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/DtoAyah"
    BaseResponseListDtoReciter:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/DtoReciter"
    DtoRecitationSummary:
      type: object
      description: "A recitation: label, style, riwayah, completeness, timings."
      properties:
        id:
          type: integer
          format: int32
        reciterId:
          type: integer
          format: int32
        nameAr:
          type: string
        nameEn:
          type: string
        style:
          type: string
          enum:
          - MURATTAL
          - MUJAWWAD
          - MUALLIM
        riwayah:
          $ref: "#/components/schemas/DtoRiwayah"
        provider:
          type: string
          enum:
          - MP3QURAN
          - EVERYAYAH
        listeningOnly:
          type: boolean
        surahCount:
          type: integer
          format: int32
        complete:
          type: boolean
        hasTimings:
          type: boolean
    DtoReciter:
      type: object
      description: A reciter and his recitations.
      properties:
        id:
          type: integer
          format: int32
        nameAr:
          type: string
        nameEn:
          type: string
        recitations:
          type: array
          items:
            $ref: "#/components/schemas/DtoRecitationSummary"
    DtoRiwayah:
      type: object
      description: "A riwayah: its name, rawi and qari, and whether it is the riwayah\
        \ of the displayed text (Hafs)."
      properties:
        id:
          type: integer
          format: int32
        nameAr:
          type: string
        nameEn:
          type: string
        rawiAr:
          type: string
        qariAr:
          type: string
        matchesDisplayedText:
          type: boolean
    BaseResponseDtoReciter:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/DtoReciter"
    BaseResponseDtoRecitation:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/DtoRecitation"
    DtoAudioSource:
      type: object
      description: "An audio source: its address template, provider, bitrate and health."
      properties:
        priority:
          type: integer
          format: int32
        kind:
          type: string
          enum:
          - SURAH_FILE
          - AYAH_FILE
        provider:
          type: string
          enum:
          - MP3QURAN
          - EVERYAYAH
        urlTemplate:
          type: string
        bitrateKbps:
          type: integer
          format: int32
        downloadAllowed:
          type: boolean
        status:
          type: string
          enum:
          - OK
          - FAILING
        lastCheckedAt:
          type: string
          format: date-time
    DtoRecitation:
      type: object
      description: "A recitation, its surahs, its audio sources in order and its credits."
      properties:
        recitation:
          $ref: "#/components/schemas/DtoRecitationSummary"
        reciterNameAr:
          type: string
        reciterNameEn:
          type: string
        surahs:
          type: array
          items:
            type: integer
            format: int32
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DtoAudioSource"
        credits:
          type: array
          items:
            $ref: "#/components/schemas/DtoContentSource"
    BaseResponseDtoSurahTimings:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/DtoSurahTimings"
    DtoAyahTiming:
      type: object
      description: An ayah's start and end in milliseconds.
      properties:
        ayah:
          type: integer
          format: int32
        startMs:
          type: integer
          format: int32
        endMs:
          type: integer
          format: int32
    DtoSurahTimings:
      type: object
      description: The ayah timings of one surah of a recitation.
      properties:
        recitationId:
          type: integer
          format: int32
        surahNumber:
          type: integer
          format: int32
        timings:
          type: array
          items:
            $ref: "#/components/schemas/DtoAyahTiming"
        source:
          $ref: "#/components/schemas/DtoContentSource"
    BaseResponseDtoQuranSearch:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/DtoQuranSearch"
    DtoQuranSearch:
      type: object
      description: "A Quran search: the ayah a reference names, the surahs a name\
        \ names, and the ayahs with the words."
      properties:
        query:
          type: string
        withTashkeel:
          type: boolean
        ayah:
          $ref: "#/components/schemas/DtoAyah"
        surahs:
          type: array
          items:
            $ref: "#/components/schemas/DtoSurah"
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        hits:
          type: array
          items:
            $ref: "#/components/schemas/DtoSearchHit"
        countsBySurah:
          type: array
          items:
            $ref: "#/components/schemas/DtoSurahCount"
        textSource:
          $ref: "#/components/schemas/DtoContentSource"
        searchSources:
          type: array
          items:
            $ref: "#/components/schemas/DtoContentSource"
    DtoSearchHit:
      type: object
      description: "An ayah that contains the searched words, and which of its words\
        \ to highlight."
      properties:
        ayah:
          $ref: "#/components/schemas/DtoAyah"
        matchedWords:
          type: array
          items:
            type: integer
            format: int32
    DtoSurahCount:
      type: object
      description: How many found ayahs are in one surah.
      properties:
        surahNumber:
          type: integer
          format: int32
        count:
          type: integer
          format: int32
    BaseResponseDtoPage:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          $ref: "#/components/schemas/DtoPage"
    DtoPage:
      type: object
      description: "The ayahs that start on a page of the Madinah mushaf, and the\
        \ source of the text."
      properties:
        page:
          type: integer
          format: int32
        ayahs:
          type: array
          items:
            $ref: "#/components/schemas/DtoAyah"
        textSource:
          $ref: "#/components/schemas/DtoContentSource"
    BaseResponseListDtoJuz:
      type: object
      description: "The envelope of every answer: success flag, code, message in the\
        \ request's language, data."
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          type: array
          items:
